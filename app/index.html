<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Portal de aprendizaje ATLAS: 66 módulos sobre Microsoft Excel, Google Sheets, VBA y Google Apps Script. Teoría, ejercicios y ejemplos reproducibles." />
    <title>ATLAS · Portal de Aprendizaje</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('atlas.theme') || 'system'
          var resolved = t === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' : t
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (_) {}
      })()
    </script>
    <script>
      // Restaura la ruta tras redirect del 404.html (patrón Rafgraph para project page).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
